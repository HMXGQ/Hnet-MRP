<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MRP 实施项目 · 进度与 Issue 跟踪</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#0f1b2d; --panel:#172a45; --panel-2:#1d3355; --border:#2c4a75;
    --text:#e8eef7; --muted:#93a5c0; --accent:#6fd3c2;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; min-height:100vh; }
  /* ===== 登录页 ===== */
  #loginView { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-box { background:var(--panel); border-radius:14px; padding:34px; width:360px; }
  .login-box h1 { font-size:20px; margin-bottom:6px; }
  .login-box .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .login-box input { width:100%; margin-bottom:12px; }
  input, select, textarea { background:var(--panel-2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 12px; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#0f1b2d; border-color:var(--accent); font-weight:600; width:100%; }
  button.primary:hover { opacity:.9; color:#0f1b2d; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.err { color:#e74c3c; } .msg.ok { color:#2ecc71; }

  /* ===== 主界面 ===== */
  #appView { display:none; padding:20px 20px 60px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .tabs { display:flex; gap:8px; }
  .tab { padding:9px 20px; border-radius:8px; border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:14px; }
  .tab.active { background:var(--accent); color:#0f1b2d; font-weight:600; border-color:var(--accent); }
  .userbox { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .hint { color:var(--muted); font-size:12px; }

  /* 表格容器：竖向滚动时表头置顶（sticky thead） */
  .table-wrap {
    overflow:auto; max-height:calc(100vh - 210px);
    background:var(--panel); border-radius:12px; border:1px solid var(--border);
  }
  table { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  th, td { border-bottom:1px solid #22395e; padding:9px 12px; font-size:13.5px; white-space:pre-wrap; word-break:break-word; vertical-align:top; }
  th { position:sticky; top:0; z-index:5; background:var(--panel-2); color:var(--muted); font-size:12px; text-transform:none; text-align:left; min-width:110px; }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:#1b3050; }
  td[contenteditable]:focus { outline:2px solid var(--accent); border-radius:4px; background:#0f1b2d; min-width:110px; }
  td.editable { cursor:text; }
  .saved-flash { animation:flash 1s; }
  @keyframes flash { 0%{background:#2ecc7133} 100%{background:transparent} }

  /* 底部固定横拉条：始终贴在可视页面底部 */
  #hscroll { position:fixed; left:0; right:0; bottom:0; height:14px; background:var(--panel); border-top:1px solid var(--border); overflow-x:auto; overflow-y:hidden; z-index:20; display:none; }
  #hscroll .inner { height:1px; }

  .archives { margin-top:22px; }
  .archives h2 { font-size:16px; margin-bottom:8px; }
  .archives ul { list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
  .archives li a { display:inline-block; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; color:var(--accent); text-decoration:none; }
  .empty { color:var(--muted); font-size:13px; padding:14px; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView">
  <div class="login-box">
    <h1>MRP 实施项目看板</h1>
    <div class="sub">项目进度 & Issue List · 仅限项目成员</div>
    <input id="email" type="email" placeholder="邮箱" autocomplete="username" />
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
    <button class="primary" id="loginBtn">登 录</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="appView">
  <div class="topbar">
    <div class="tabs">
      <div class="tab active" data-table="progress">项目进度表</div>
      <div class="tab" data-table="issues">Issue List</div>
      <div class="tab" data-table="archive">历史存档</div>
    </div>
    <div class="userbox"><span id="whoami"></span><button id="logoutBtn">退出</button></div>
  </div>

  <div id="tableArea">
    <div class="toolbar">
      <button id="addRowBtn">＋ 新增一行</button>
      <button id="delRowBtn">－ 删除选中行</button>
      <span class="hint">单击单元格即可编辑，离开单元格自动保存；每周日 0 点系统自动滚动周计划并存档 Excel</span>
    </div>
    <div class="table-wrap" id="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>

  <div id="archiveArea" class="archives" style="display:none">
    <h2>每周自动存档（Excel，更新前快照）</h2>
    <ul id="archiveList"></ul>
  </div>
</div>

<div id="hscroll"><div class="inner" id="hscrollInner"></div></div>

<script>
// ============ 配置（部署时替换） ============
const SUPABASE_URL = 'https://qdsrgzlkfuogvzccxwfd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_k866XlNFUKV8JvVcA6TjGg_VEgXRZrJ';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SPECIAL = ['本周工作计划','本周工作进展','下周工作计划'];
const TABLES = {
  progress: { db:'progress_rows', name:'项目进度表' },
  issues:   { db:'issue_rows',    name:'Issue List' }
};
let current = 'progress';
let columns = { progress:[], issues:[] };   // 列配置（来自 columns 表）
let rows = [];
let selected = new Set();

// ============ 登录 ============
const $ = id => document.getElementById(id);
$('loginBtn').onclick = async () => {
  const msg = $('loginMsg');
  msg.textContent = '登录中…'; msg.className = 'msg';
  const { error } = await supabase.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
  if (error) { msg.textContent = '登录失败：' + (error.message === 'Invalid login credentials' ? '邮箱或密码错误' : error.message); msg.className = 'msg err'; }
};
supabase.auth.onAuthStateChange((_, session) => session ? showApp() : showLogin());
$('logoutBtn').onclick = () => supabase.auth.signOut();

function showLogin(){ $('loginView').style.display='flex'; $('appView').style.display='none'; }
async function showApp(){
  $('loginView').style.display='none'; $('appView').style.display='block';
  $('whoami').textContent = (await supabase.auth.getUser()).data.user?.email || '';
  await loadColumns('progress'); await loadColumns('issues');
  switchTab('progress');
}

// ============ Tab 切换 ============
document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.table));
function switchTab(name){
  current = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.table === name));
  const isArchive = name === 'archive';
  $('tableArea').style.display = isArchive ? 'none' : 'block';
  $('archiveArea').style.display = isArchive ? 'block' : 'none';
  if (isArchive) loadArchives(); else { loadRows(); }
}

// ============ 数据加载 ============
async function loadColumns(key){
  const { data } = await supabase.from('columns').select('key,sort').eq('table_name', TABLES[key].db).order('sort');
  columns[key] = (data || []).map(c => c.key);
}
async function loadRows(){
  const { data, error } = await supabase.from(TABLES[current].db).select('id,data,updated_by').order('sort_order');
  if (error) { alert('读取失败：' + error.message); return; }
  rows = data || [];
  selected.clear();
  renderTable();
}

function renderTable(){
  const cols = columns[current];
  $('thead').innerHTML = '<th style="min-width:36px"><input type="checkbox" id="checkAll"></th><th style="min-width:40px">#</th>' +
    cols.map(c => `<th>${esc(c)}</th>`).join('');
  $('tbody').innerHTML = rows.length ? rows.map((r, i) =>
    `<tr data-id="${r.id}">
      <td><input type="checkbox" class="rowchk" data-id="${r.id}"></td>
      <td style="color:var(--muted)">${i+1}</td>
      ${cols.map(c => `<td class="editable" contenteditable="true" data-col="${esc(c)}">${esc(r.data?.[c] ?? '')}</td>`).join('')}
    </tr>`).join('')
    : `<tr><td colspan="${cols.length+2}" class="empty">暂无数据。点击上方「新增一行」添加，或等管理员导入初始表格。</td></tr>`;

  $('checkAll').onchange = e => document.querySelectorAll('.rowchk').forEach(c => { c.checked = e.target.checked; syncSel(); });
  document.querySelectorAll('.rowchk').forEach(c => c.onchange = syncSel);
  document.querySelectorAll('td.editable').forEach(td => {
    td.addEventListener('blur', () => saveCell(td));
    td.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); td.blur(); } });
  });
  syncHScroll();
}
function syncSel(){ selected = new Set([...document.querySelectorAll('.rowchk:checked')].map(c => c.dataset.id)); }

async function saveCell(td){
  const id = +td.closest('tr').dataset.id, col = td.dataset.col, val = td.innerText.replace(/\u00a0/g,' ').trim();
  const row = rows.find(r => r.id === id);
  if (!row || (row.data?.[col] ?? '') === val) return;
  const newData = { ...(row.data || {}), [col]: val };
  const { error } = await supabase.from(TABLES[current].db).update({ data: newData }).eq('id', id);
  if (error) { alert('保存失败：' + error.message); return; }
  row.data = newData;
  td.classList.remove('saved-flash'); void td.offsetWidth; td.classList.add('saved-flash');
}

$('addRowBtn').onclick = async () => {
  const maxSort = rows.length ? await supabase.from(TABLES[current].db).select('sort_order').order('sort_order',{ascending:false}).limit(1).then(r => r.data?.[0]?.sort_order ?? 0) : 0;
  const { error } = await supabase.from(TABLES[current].db).insert({ data:{}, sort_order:(maxSort||0)+1 });
  if (error) return alert('新增失败：' + error.message);
  loadRows();
};
$('delRowBtn').onclick = async () => {
  if (!selected.size) return alert('请先勾选要删除的行');
  if (!confirm(`确定删除 ${selected.size} 行？`)) return;
  const { error } = await supabase.from(TABLES[current].db).delete().in('id', [...selected]);
  if (error) return alert('删除失败：' + error.message);
  loadRows();
};

// ============ 历史存档 ============
async function loadArchives(){
  const { data, error } = await supabase.storage.from('archives').list('', { sortBy:{ column:'name', order:'desc' } });
  if (error || !data?.length) { $('archiveList').innerHTML = '<li class="empty">暂无存档（每周日 0 点自动生成）</li>'; return; }
  const items = await Promise.all(data.map(async f => {
    const { data: url } = await supabase.storage.from('archives').createSignedUrl(f.name, 3600);
    return `<li><a href="${url?.signedUrl || '#'}" download>📄 ${esc(f.name)}</a></li>`;
  }));
  $('archiveList').innerHTML = items.join('');
}

// ============ 底部固定横拉条（与表格容器同步滚动） ============
const wrap = $('tableWrap'), hs = $('hscroll'), inner = $('hscrollInner');
function syncHScroll(){
  const need = wrap.scrollWidth > wrap.clientWidth + 2;
  hs.style.display = need ? 'block' : 'none';
  inner.style.width = wrap.scrollWidth + 'px';
}
hs.onscroll = () => wrap.scrollLeft = hs.scrollLeft;
wrap.onscroll = () => hs.scrollLeft = wrap.scrollLeft;
window.addEventListener('resize', syncHScroll);

const esc = t => String(t ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
</script>
</body>
</html>
